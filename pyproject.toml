[project]
name = "sales_order_pdf_import"
version = "0.0.1"
description = "Import customer purchase-order PDFs into ERPNext Sales Orders"
requires-python = ">=3.10"
dependencies = ["pypdf>=4.0,<7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sales_order_pdf_import*"]
